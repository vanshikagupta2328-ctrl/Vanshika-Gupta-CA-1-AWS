<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .block {
            display: block;
            position: static;
            width: 100px;
            padding: 20px;
            margin: 10px;
            border: 3px solid blue;
            border-radius: 10px;
        }
        
        .inlineblock {
            display: inline-block;
            width: 100px;
            height: 20PX;
            width: 40px;
            padding: 20px;
            margin: 10px;
            border: 3px solid blue;
            border-radius: 10px;
        }
        
        .inline {
            width: 100px;
            height: 100px;
            width: 200px;
            padding: 20px;
            margin: 10px;
            border: 3px solid blue;
            border-radius: 10px;
            display: inline;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>1. BLOCK</h2>
    <div class="block">BOX1</div>
    <div class="block">BOX2</div>
    <div class="block">BOX3</div>
    <h3> 2.INLINE BLOCK</h3>
    <div class="inlineblock">HELLO</div>
    <div class="inlineblock">HELLO</div>
    <h3> 3.INLINE</h3>
    <div class="inline">HI</div>
    <div class="inline">HI1</div>



</body>

</html>
