<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let age = 20;
        console.log("age==20:", age == 20);
        console.log("age === 20:", age === 20);
        console.log("age != 19:", age != 19);
        console.log("age !== 18:", age !== 18);
        console.log("age > 18:", age > 18);
        console.log("age < 18:", age < 18);
        console.log("age >= 20:", age >= 20);
        let marks = 80;
        console.log(
            "AND:",
            marks >= 40 && marks <= 100
        );
        console.log(
            "OR",
            marks < 40 || marks >= 40
        );
        let passed = true;
        console.log(
            "NOT", !passed
        );
        console.log(5 == "5");
        console.log(5 === "5");
    </script>
</body>

</html>
