<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Design</title>
    <style>
        .main {
            width: 100%;
            height: 650px;
            background-color: black;
        }
        
        .left {
            width: 20%;
            height: 654px;
            background-color: rgba(128, 128, 128, 0.269);
            float: left;
        }
        
        .right {
            width: 80%;
            height: 654px;
            background-color: gray;
            float: right;
        }
        
        .chat {
            width: 100%;
            height: 170px;
            background-color: green;
            display: flex;
        }
        
        .today {
            width: 100%;
            height: 170px;
            background-color: aqua;
        }
        
        .previous {
            width: 100%;
            height: 314px;
            background-color: brown;
        }
        
        .left1 {
            width: 20%;
            height: 170px;
            background-color: rgb(0, 51, 128);
        }
        
        .left2 {
            width: 80%;
            height: 170px;
            background-color: green;
        }
        /* Boxes inside left1 */
        
        .box1,
        .box2,
        .box3,
        .box4 {
            width: 200%;
            height: 43px;
            background-color: rgb(128, 92, 0);
            color: #fff;
        }
        
        .box2,
        .box4 {
            background-color: aquamarine;
            color: #000;
        }
        /* Boxes inside left2 */
        
        .box5,
        .box6,
        .box7,
        .box8 {
            width: 100%;
            height: 43px;
            color: #fff;
        }
        
        .box5 {
            background-color: rgb(125, 158, 241);
            /* light blue */
        }
        
        .box6 {
            background-color: rgb(46, 204, 113);
            /* green */
        }
        
        .box7 {
            background-color: rgb(241, 196, 15);
            /* yellow */
            color: #000;
        }
        
        .box8 {
            background-color: rgb(231, 76, 60);
            /* red */
        }
        
        .left3 {
            width: 20%;
            height: 170px;
            background-color: chartreuse;
            float: left;
        }
        
        .left4 {
            width: 100%;
            height: 170px;
            background-color: rgb(246, 255, 0);
        }
        
        .box9 {
            width: 100%;
            height: 30px;
            background-color: #000;
            color: white;
            line-height: 35px;
        }
        
        .box10,
        .box11,
        .box12,
        .box13 {
            width: 100%;
            height: 35px;
            background-color: brown;
        }
        
        .box11 {
            background-color: aquamarine;
        }
        
        .box13 {
            background-color: chocolate;
        }
        
        .box14 {
            width: 100%;
            height: 30px;
            background-color: black;
        }
        
        .fir {
            width: 100%;
            height: 40px;
            background-color: aquamarine;
            float: left;
        }
        
        .sec {
            width: 100%;
            height: 684px;
            background-color: rgb(36, 59, 51);
            float: left;
        }
        
        .box15,
        .box16,
        .box17,
        .box18 {
            width: 100%;
            height: 35px;
            background-color: blue;
        }
        
        .box16 {
            background-color: rgb(127, 255, 133);
        }
        
        .box18 {
            background-color: cadetblue;
        }
        
        .left5 {
            width: 20%;
            height: 314px;
            background-color: aquamarine;
            float: left;
        }
        
        .left6 {
            width: 80%;
            height: 314px;
            background-color: brown;
        }
        
        .box19 {
            width: 100%;
            height: 30px;
            background-color: #000;
            color: white;
            line-height: 20px;
        }
        
        .box23 {
            width: 200%;
            height: 30px;
            background-color: black;
            color: white;
            line-height: 20px;
            padding-left: 30px;
            margin-left: 30px;
        }
        
        .box20,
        .box21,
        .box22 {
            width: 100%;
            height: 35px;
            background-color: chocolate;
        }
        
        .box21 {
            background-color: aqua;
        }
        
        .box24,
        .box25,
        .box26 {
            width: 200%;
            height: 35px;
            background-color: burlywood;
        }
        
        .box25 {
            background-color: black;
        }
        
        .box27 {
            width: 100%;
            height: 70px;
            background-color: #000;
            margin-top: 108px;
        }
        
        .box28 {
            width: 200%;
            height: 70px;
            background-color: #000;
            margin-top: 108px;
        }
        
        .help {
            width: 40%;
            height: 100px;
            background-color: aquamarine;
            margin-top: 120px;
            margin-left: 250px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="left">
            <div class="chat">
                <div class="left1">
                    <div class="box1">Box 1</div>
                    <div class="box2">Box 2</div>
                    <div class="box3">Box 3</div>
                    <div class="box4">Box 4</div>
                </div>
                <div class="left2">
                    <div class="box5">Box 5</div>
                    <div class="box6">Box 6</div>
                    <div class="box7">Box 7</div>
                    <div class="box8">Box 8</div>
                </div>
            </div>
            <div class="today">
                <div class="left3">
                    <div class="box9">Today</div>
                    <div class="box10"></div>
                    <div class="box11"></div>
                    <div class="box12"></div>
                    <div class="box13"></div>
                </div>
                <div class="left4">
                    <div class="box14"></div>
                    <div class="box15"></div>
                    <div class="box16"></div>
                    <div class="box17"></div>
                    <div class="box18"></div>
                </div>
            </div>
            <div class="previous">
                <div class="left5">
                    <div class="box19">Previous</div>
                    <div class="box20"></div>
                    <div class="box21"></div>
                    <div class="box22"></div>
                    <div class="box27"></div>
                </div>
                <div class="left6">
                    <div class="box23">7 Days</div>
                    <div class="box24"></div>
                    <div class="box25"></div>
                    <div class="box26"></div>
                    <div class="box28"></div>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="fir">first</div>
            <div class="sec">
                <div class="help"></div>
            </div>
        </div>
    </div>
</body>

</html>
