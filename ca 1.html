<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Frontend</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #212121;
            color: white;
        }
        
        .main {
            width: 100%;
            height: 100vh;
        }
        /* Left sidebar */
        
        .left {
            width: 250px;
            height: 100vh;
            background-color: #171717;
            float: left;
            padding: 15px;
        }
        
        .chat {
            width: 100%;
            height: 45px;
            background-color: #171717;
            margin-bottom: 20px;
        }
        
        .newchat {
            width: 100%;
            height: 40px;
            background-color: #303030;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            text-align: left;
            padding: 10px;
            font-size: 15px;
        }
        
        .search {
            width: 100%;
            height: 40px;
            padding: 10px;
            color: #cccccc;
            margin-bottom: 20px;
        }
        
        .today {
            width: 100%;
            height: auto;
            margin-top: 15px;
        }
        
        .heading {
            color: #999999;
            font-size: 13px;
            margin-bottom: 10px;
        }
        
        .previouschat {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            margin-bottom: 5px;
        }
        
        .previouschat:hover {
            background-color: #303030;
        }
        
        .bottom {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 220px;
            padding: 10px;
            border-top: 1px solid #444;
        }
        /* Right main area */
        
        .right {
            width: calc(100% - 250px);
            height: 100vh;
            float: right;
            background-color: #212121;
            position: relative;
        }
        
        .fir {
            width: 100%;
            height: 60px;
            padding: 20px;
            font-size: 16px;
        }
        
        .sec {
            width: 100%;
            text-align: center;
            padding: 100px 20px 20px;
        }
        
        .welcome {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 35px;
        }
        
        .suggestions {
            width: 70%;
            margin: 0 auto;
        }
        
        .suggestion {
            display: inline-block;
            width: 45%;
            padding: 15px;
            margin: 5px;
            border: 1px solid #444;
            border-radius: 12px;
            color: #dddddd;
            text-align: left;
            font-size: 14px;
        }
        /* Message input area */
        
        .help {
            width: 70%;
            min-height: 60px;
            background-color: #303030;
            border: 1px solid #555;
            border-radius: 15px;
            margin: 100px auto 0;
            padding: 15px;
            text-align: left;
            color: #aaaaaa;
        }
        
        .message {
            width: 85%;
            background-color: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 15px;
        }
        
        .send {
            float: right;
            background-color: white;
            color: black;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
        }
        
        .note {
            font-size: 12px;
            color: #888888;
            margin-top: 15px;
        }
        /* For smaller screens */
        
        @media screen and (max-width: 700px) {
            .left {
                width: 180px;
                padding: 10px;
            }
            .right {
                width: calc(100% - 180px);
            }
            .welcome {
                font-size: 22px;
            }
            .suggestions {
                width: 100%;
            }
            .suggestion {
                width: 90%;
            }
            .help {
                width: 95%;
                margin-top: 60px;
            }
            .bottom {
                width: 155px;
                left: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <!-- Left sidebar -->
        <div class="left">

            <div class="chat">
                <button class="newchat">+ New chat</button>
            </div>

            <div class="search">
                Search chats
            </div>

            <div class="today">
                <div class="heading">Today</div>

                <div class="previouschat">HTML and CSS basics</div>
                <div class="previouschat">Learn JavaScript</div>
                <div class="previouschat">Create a website</div>
                <div class="previouschat">Interview questions</div>
            </div>

            <div class="today">
                <div class="heading">Previous 7 days</div>

                <div class="previouschat">CSS layout practice</div>
                <div class="previouschat">Learn programming</div>
                <div class="previouschat">My project ideas</div>
            </div>

            <div class="bottom">
                <div class="previouschat">👤 My Profile</div>
            </div>

        </div>

        <!-- Right main area -->
        <div class="right">

            <div class="fir">
                ChatGPT
            </div>

            <div class="sec">

                <div class="welcome">
                    What can I help with?
                </div>

                <div class="suggestions">

                    <div class="suggestion">
                        💡 Get advice
                    </div>

                    <div class="suggestion">
                        ✍️ Write something
                    </div>

                    <div class="suggestion">
                        💻 Code something
                    </div>

                    <div class="suggestion">
                        📚 Learn something
                    </div>

                </div>

                <div class="help">

                    <input type="text" class="message" placeholder="Message ChatGPT">

                    <button class="send">↑</button>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
