<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        h1 {
            color: rgb(0, 255, 0);
            text-align: center;
            text-decoration: underline;
            text-transform: capitalize;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 30px;
            font-weight: bold;
            font-style: italic;
        }
        
        p {
            color: #0000ff;
            text-decoration: overline;
            text-transform: lowercase;
        }
        
        h2 {
            color: hsl(0, 100%, 50%);
            text-decoration: line-through;
            text-transform: uppercase;
        }
    </style>

</head>

<body>
    <h1>
        My name is Vanshika
    </h1>
    <h2>
        Good Morning
    </h2>
    <p>HELLO</p>
</body>

</html>
<!-- text align used to position the text it is the property of css-->
